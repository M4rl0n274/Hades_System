{% extends 'navBar.html' %}

{% block barraNavegacion %}
<main class="main-content">
  <!-- Cabecera Reutilizable -->
  <div class="form-header-wrapper">
    <h2>Editar Vendedor</h2>
  </div>

  <!-- Tarjeta Contenedora del Formulario -->
  <div class="form-card">
    <form method="POST" action="{{ url_for('vendedores.editar', id=vendedor.id) }}" class="custom-form">
      
      <!-- Bloque 1: Información Personal (2 Columnas) -->
      <div class="form-grid grid-col-2">
        <div class="form-group">
          <label for="nombre">Nombre</label>
          <input type="text" class="form-control" id="nombre" name="nombre" value="{{ vendedor.nombre }}" required>
        </div>

        <div class="form-group">
          <label for="apellido">Apellidos</label>
          <input type="text" class="form-control" id="apellido" name="apellido" value="{{ vendedor.apellido }}" required>
        </div>
      </div>

      <!-- Bloque 2: Documento y Correo (2 Columnas) -->
      <div class="form-grid grid-col-2">
        <div class="form-group">
          <label for="documento_identidad">Documento de Identidad</label>
          <input type="text" class="form-control" id="documento_identidad" name="documento_identidad" value="{{ vendedor.documento_identidad }}" required>
        </div>

        <div class="form-group">
          <label for="correo">Correo Electrónico</label>
          <input type="email" class="form-control" id="correo" name="correo" value="{{ vendedor.correo }}" required>
        </div>
      </div>

      <!-- Botones de Acción -->
      <div class="form-actions" style="display: flex; gap: 10px; align-items: center;">
        <button type="submit" class="btn-primary">Actualizar Vendedor</button>
        <a href="{{ url_for('vendedores.index') }}" class="btn btn-secondary" style="text-decoration: none; padding: 0.5rem 1rem; border-radius: 4px;">Cancelar</a>
      </div>

    </form>
  </div>
</main>
{% endblock %}
