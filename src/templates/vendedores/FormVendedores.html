{% extends 'navBar.html' %}

{% block barraNavegacion %}
<main>
    <div class="container mt-4">
        <h2 class="mb-4">Registro de vendedores</h2>

        <form method="POST">

            <!-- Bloque 1: Información Personal -->
            <div class="form-row">
                <div class="form-group col-md-6">
                    <label for="nombre">Nombre</label>
                    <input type="text" class="form-control" id="nombre" name="nombre"
                        placeholder="Ingrese su Nombre o nombres">
                </div>

                <div class="form-group col-md-6">
                    <label for="apellido">Apellidos</label>
                    <input type="text" class="form-control" id="apellido" name="apellido" placeholder="Apellidos">
                </div>
            </div>

            <!-- Documento y Correo -->
            <div class="form-row">
                <div class="form-group col-md-6">
                    <label for="documentoIdentidad">Documento de Identidad</label>
                    <input type="text" class="form-control" id="documento_identidad"
                        name="documento_identidad" placeholder="C.C">
                </div>

                <div class="form-group col-md-6">
                    <label for="correo">Correo</label>
                    <input type="email" class="form-control" id="correo"
                        name="correo" placeholder="correo">
                </div>
            </div>

            <!-- Botón de envío -->
            <div class="mt-3">
                <button type="submit" class="btn btn-primary px-4">
                    Enviar
                </button>
            </div>

        </form>
    </div>
</main>
{% endblock %}
