{% extends 'navBar.html' %}

{% block barraNavegacion %}
<main class="main-content">
  <!-- Cabecera Reutilizable -->
  <div class="form-header-wrapper">
    <h2>Registro de Vendedores</h2>
  </div>

  <!-- Tarjeta Contenedora del Formulario -->
  <div class="form-card">
    <form method="POST" class="custom-form">
      
      <!-- Bloque 1: Información Personal (2 Columnas) -->
      <div class="form-grid grid-col-2">
        <div class="form-group">
          <label for="nombre">Nombre</label>
          <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Ingrese su Nombre o nombres" required>
        </div>

        <div class="form-group">
          <label for="apellido">Apellidos</label>
          <input type="text" class="form-control" id="apellido" name="apellido" placeholder="Apellidos" required>
        </div>
      </div>

      <!-- Bloque 2: Documento y Correo (2 Columnas) -->
      <div class="form-grid grid-col-2">
        <div class="form-group">
          <label for="documento_identidad">Documento de Identidad</label>
          <input type="text" class="form-control" id="documento_identidad" name="documento_identidad" placeholder="C.C / C.E" required>
        </div>

        <div class="form-group">
          <label for="correo">Correo Electrónico</label>
          <input type="email" class="form-control" id="correo" name="correo" placeholder="correo@ejemplo.com" required>
        </div>
      </div>

      <!-- Botón de Envío -->
      <div class="form-actions">
        <button type="submit" class="btn-primary">Enviar</button>
      </div>

    </form>
  </div>
</main>
{% endblock %}
