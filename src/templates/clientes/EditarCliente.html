{% extends 'navBar.html' %}

{% block barraNavegacion %}
<main class="main-content">
  <!-- Cabecera Reutilizable -->
  <div class="form-header-wrapper">
    <h2>Editar Cliente</h2>
  </div>

  <!-- Tarjeta Contenedora del Formulario -->
  <div class="form-card">
    <form method="POST" action="{{ url_for('clientes.editar', id=cliente.id) }}" class="custom-form">
      
      <!-- Bloque 1: Nombres y Apellidos (2 Columnas) -->
      <div class="form-grid grid-col-2">
        <div class="form-group">
          <label for="nombre">Nombre</label>
          <input type="text" class="form-control" id="nombre" name="nombre" value="{{ cliente.nombre }}" required>
        </div>
        <div class="form-group">
          <label for="apellido">Apellido</label>
          <input type="text" class="form-control" id="apellido" name="apellido" value="{{ cliente.apellido }}" required>
        </div>
      </div>

      <!-- Bloque 2: Documento, Edad y Fecha (3 Columnas) -->
      <div class="form-grid grid-col-3">
        <div class="form-group">
          <label for="documentoIdentidad">Documento de Identidad</label>
          <input type="text" class="form-control" id="documentoIdentidad" name="documentoIdentidad" value="{{ cliente.documentoIdentidad }}" required>
        </div>
        <div class="form-group">
          <label for="edad">Edad</label>
          <input type="number" class="form-control" id="edad" name="edad" value="{{ cliente.edad }}" required>
        </div>
        <div class="form-group">
          <label for="FechaDeNacimiento">Fecha de Nacimiento</label>
          <input type="date" class="form-control" id="FechaDeNacimiento" name="FechaDeNacimiento" value="{{ cliente.FechaDeNacimiento }}" required>
        </div>
      </div>

      <!-- Bloque 3: Contacto (2 Columnas) -->
      <div class="form-grid grid-col-2">
        <div class="form-group">
          <label for="correo">Correo Electrónico</label>
          <input type="email" class="form-control" id="correo" name="correo" value="{{ cliente.correo }}" required>
        </div>
        <div class="form-group">
          <label for="telefono">Teléfono</label>
          <input type="text" class="form-control" id="telefono" name="telefono" value="{{ cliente.telefono }}" required>
        </div>
      </div>

      <!-- Bloque 4: Dirección (1 Columna) -->
      <div class="form-grid grid-col-1">
        <div class="form-group">
          <label for="direccion">Dirección</label>
          <input type="text" class="form-control" id="direccion" name="direccion" value="{{ cliente.direccion }}" required>
        </div>
      </div>

      <!-- Botones de Acción -->
      <div class="form-actions" style="display: flex; gap: 10px; align-items: center;">
        <button type="submit" class="btn-primary">Actualizar Cliente</button>
        <a href="{{ url_for('clientes.index') }}" class="btn btn-secondary" style="text-decoration: none; padding: 0.5rem 1rem; border-radius: 4px;">Cancelar</a>
      </div>

    </form>
  </div>
</main>
{% endblock %}
