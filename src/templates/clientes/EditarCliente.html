{% extends 'navBar.html' %}

{% block barraNavegacion %}
<main class="main-content">
  <!-- Cabecera Reutilizable -->
  <div class="form-header-wrapper">
    <h2>Editar Cliente</h2>
  </div>

  <!-- Tarjeta Contenedora del Formulario -->
  <div class="form-card">
    <form method="POST" action="{{ url_for('clientes.editar', id=cliente.id) }}" class="custom-form" id="formCliente" novalidate>

      <!-- Bloque 1: Nombres y Apellidos (2 Columnas) -->
      <div class="form-grid grid-col-2">
        <div class="form-group">
          <label for="nombre">Nombre</label>
          <input type="text" class="form-control" id="nombre" name="nombre" value="{{ cliente.nombre }}" required>
        </div>
        <div class="form-group">
          <label for="apellido">Apellido</label>
          <input type="text" class="form-control" id="apellido" name="apellido" value="{{ cliente.apellido }}" required>
        </div>
      </div>

      <!-- Bloque 2: Documento, Edad y Fecha (3 Columnas) -->
      <div class="form-grid grid-col-3">
        <div class="form-group">
          <label for="documentoIdentidad">Documento de Identidad</label>
          <input type="text" class="form-control" id="documentoIdentidad" name="documentoIdentidad"
            value="{{ cliente.documentoIdentidad }}" required>
        </div>
        <div class="form-group">
          <label for="edad">Edad</label>
          <input type="number" class="form-control" id="edad" name="edad" value="{{ cliente.edad }}" required>
        </div>

        <div class="form-group">
          <label for="fecha_nacimiento" class="form-label">Fecha de Nacimiento</label>
          <input type="date" class="form-control" id="fecha_nacimiento" name="fecha_nacimiento"
            value="{% if cliente.fecha_nacimiento %}{{ cliente.fecha_nacimiento.strftime('%Y-%m-%d') if cliente.fecha_nacimiento.strftime is defined else cliente.fecha_nacimiento[:10] }}{% endif %}">
          <small class="form-text text-muted">Deja este campo como está si no deseas cambiar la fecha.</small>



        </div>
      </div>

      <!-- Bloque 3: Contacto y Credenciales (3 Columnas) -->
      <div class="form-grid grid-col-3">
        <div class="form-group">
          <label for="correo">Correo Electrónico</label>
          <input type="email" class="form-control" id="correo" name="correo" value="{{ cliente.correo }}" required>
        </div>
        <div class="form-group">
          <label for="password">Nueva Contraseña <small
              style="color: #6c757d; font-weight: normal;">(Opcional)</small></label>
          <div class="password-wrapper">
            <input type="password" class="form-control" id="password" name="password"
                   placeholder="Dejar en blanco para mantener la actual"
                   minlength="8"
                   autocomplete="new-password"
                   aria-describedby="passwordHelp passwordStrengthText">
            <button type="button" class="password-toggle" id="togglePassword"
                    aria-label="Mostrar contraseña" title="Mostrar contraseña">
              <span class="password-eye" aria-hidden="true">◉</span>
            </button>
          </div>

          <div class="password-strength" aria-live="polite">
            <div class="password-strength-bar">
              <div class="password-strength-fill" id="passwordStrengthFill"></div>
            </div>
            <small id="passwordStrengthText">Déjalo en blanco para mantener la contraseña actual.</small>
            <div class="password-requirements" id="passwordHelp">
              <span id="reqLength">8 caracteres</span>
              <span id="reqNumber">1 número</span>
              <span id="reqSymbol">1 símbolo = contraseña fuerte</span>
            </div>
          </div>
        </div>
        <div class="form-group">
          <label for="telefono">Teléfono</label>
          <input type="text" class="form-control" id="telefono" name="telefono" value="{{ cliente.telefono }}" required>
        </div>
      </div>

      <!-- Bloque 4: Dirección (1 Columna) -->
      <div class="form-grid grid-col-1">
        <div class="form-group">
          <label for="direccion">Dirección</label>
          <input type="text" class="form-control" id="direccion" name="direccion" value="{{ cliente.direccion }}"
            required>
        </div>
      </div>

      <!-- Botones de Acción -->
      <div class="form-actions" style="display: flex; gap: 10px; align-items: center;">
        <button type="submit" class="btn-primary">Actualizar Cliente</button>
        <a href="{{ url_for('clientes.index') }}" class="btn btn-secondary"
          style="text-decoration: none; padding: 0.5rem 1rem; border-radius: 4px;">Cancelar</a>
      </div>

    </form>
  </div>
</main>

<style>
  .password-wrapper {
    position: relative;
    display: flex;
    align-items: center;
  }

  .password-wrapper .form-control {
    padding-right: 2.75rem;
  }

  .password-toggle {
    position: absolute;
    right: 0.55rem;
    top: 50%;
    transform: translateY(-50%);
    border: 0;
    background: transparent;
    padding: 0.25rem 0.4rem;
    cursor: pointer;
    color: inherit;
    line-height: 1;
  }

  .password-toggle:focus {
    outline: 2px solid currentColor;
    outline-offset: 2px;
    border-radius: 4px;
  }

  .password-eye {
    font-size: 1rem;
  }

  .password-strength {
    margin-top: 0.4rem;
  }

  .password-strength-bar {
    width: 100%;
    height: 5px;
    border-radius: 4px;
    overflow: hidden;
    background: #e5e7eb;
  }

  .password-strength-fill {
    width: 0;
    height: 100%;
    border-radius: inherit;
    transition: width 0.2s ease;
  }

  .password-strength-fill.weak {
    width: 33%;
    background: #dc3545;
  }

  .password-strength-fill.medium {
    width: 66%;
    background: #ffc107;
  }

  .password-strength-fill.strong {
    width: 100%;
    background: #28a745;
  }

  .password-strength small {
    display: block;
    margin-top: 0.25rem;
  }

  .password-requirements {
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem 0.75rem;
    margin-top: 0.2rem;
    font-size: 0.75rem;
  }

  .password-requirements span {
    opacity: 0.75;
  }

  .password-requirements span.valid {
    opacity: 1;
    font-weight: 600;
  }

  @media (max-width: 576px) {
    .password-requirements {
      flex-direction: column;
      gap: 0.15rem;
    }
  }
</style>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const form = document.getElementById('formCliente');
    const password = document.getElementById('password');
    const togglePassword = document.getElementById('togglePassword');
    const strengthFill = document.getElementById('passwordStrengthFill');
    const strengthText = document.getElementById('passwordStrengthText');
    const reqLength = document.getElementById('reqLength');
    const reqNumber = document.getElementById('reqNumber');
    const reqSymbol = document.getElementById('reqSymbol');
    const email = document.getElementById('correo');

    // Mostrar / ocultar contraseña.
    togglePassword.addEventListener('click', function () {
      const isPassword = password.type === 'password';
      password.type = isPassword ? 'text' : 'password';
      togglePassword.setAttribute(
        'aria-label',
        isPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'
      );
      togglePassword.setAttribute(
        'title',
        isPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'
      );
    });

    function updatePasswordStrength() {
      const value = password.value;
      const hasLength = value.length >= 8;
      const hasNumber = /\d/.test(value);
      const hasSymbol = /[^A-Za-zÁÉÍÓÚáéíóúÑñÜü0-9\s]/.test(value);

      reqLength.classList.toggle('valid', hasLength);
      reqNumber.classList.toggle('valid', hasNumber);
      reqSymbol.classList.toggle('valid', hasSymbol);

      strengthFill.className = 'password-strength-fill';

      if (!value) {
        strengthText.textContent = 'Déjalo en blanco para mantener la contraseña actual.';
        return;
      }

      if (!hasLength) {
        strengthFill.classList.add('weak');
        strengthText.textContent = 'Débil: debe tener mínimo 8 caracteres.';
      } else if (!hasNumber) {
        strengthFill.classList.add('weak');
        strengthText.textContent = 'Débil: agrega al menos un número.';
      } else if (!hasSymbol) {
        strengthFill.classList.add('medium');
        strengthText.textContent = 'Media: agrega un símbolo para que sea fuerte.';
      } else {
        strengthFill.classList.add('strong');
        strengthText.textContent = 'Fuerte: cumple todos los requisitos.';
      }
    }

    password.addEventListener('input', updatePasswordStrength);
    updatePasswordStrength();

    form.addEventListener('submit', function (event) {
      const passwordValue = password.value.trim();

      // En edición la contraseña puede quedar vacía para conservar la actual.
      if (passwordValue && (!/.{8,}/.test(passwordValue) || !/\d/.test(passwordValue))) {
        event.preventDefault();
        password.focus();
        alert('La contraseña debe tener mínimo 8 caracteres y al menos un número.');
        return;
      }

      const emailValue = email.value.trim();
      const emailValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailValue);

      if (!emailValid) {
        event.preventDefault();
        email.focus();
        alert('Ingrese un correo electrónico válido que contenga @ y un dominio.');
        return;
      }

      if (!form.checkValidity()) {
        event.preventDefault();
        form.reportValidity();
      }
    });
  });
</script>
{% endblock %}
