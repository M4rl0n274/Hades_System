{% extends 'navBar.html' %}

{% block barraNavegacion %}
<main class="main-content">
  <!-- Cabecera Reutilizable -->
  <div class="form-header-wrapper">
    <h2>Registro de Cliente</h2>
  </div>

  <!-- Tarjeta Contenedora del Formulario -->
  <div class="form-card">
    <form method="POST" class="custom-form">
      
      <!-- Bloque 1: Información Personal (2 Columnas) -->
      <div class="form-grid grid-col-2">
        <div class="form-group">
          <label for="nombre">Nombre</label>
          <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Ingrese su Nombre o nombres" required>
        </div>
        <div class="form-group">
          <label for="apellido">Apellidos</label>
          <input type="text" class="form-control" id="apellido" name="apellido" placeholder="Apellidos" required>
        </div>
      </div>

      <!-- Bloque 2: Datos de Contacto y Edad (3 Columnas) -->
      <div class="form-grid grid-col-3">
        <div class="form-group">
          <label for="edad">Edad</label>
          <input type="number" class="form-control" id="edad" name="edad" placeholder="Edad">
        </div>
        <div class="form-group">
          <label for="correo">Correo</label>
          <input type="email" class="form-control" id="correo" name="correo" placeholder="correo@ejemplo.com">
        </div>
        <div class="form-group">
          <label for="documentoIdentidad">Documento de Identidad</label>
          <input type="text" class="form-control" id="documentoIdentidad" name="documentoIdentidad" placeholder="C.C / C.E">
        </div>
      </div>

      <!-- Bloque 3: Ubicación y Fechas (3 Columnas) -->
      <div class="form-grid grid-col-3">
        <div class="form-group">
          <label for="direccion">Dirección</label>
          <input type="text" class="form-control" id="direccion" name="direccion" placeholder="Calle 3 # 12 - 21">
        </div>
        <div class="form-group">
          <label for="telefono">Teléfono</label>
          <input type="number" class="form-control" id="telefono" name="telefono" placeholder="658978">
        </div>
        <div class="form-group">
          <label for="FechaDeNacimiento">Fecha de Nacimiento</label>
          <input type="date" class="form-control" id="FechaDeNacimiento" name="FechaDeNacimiento">
        </div>
      </div>

      <!-- Botón de Envío -->
      <div class="form-actions">
        <button type="submit" class="btn-primary">Enviar</button>
      </div>

    </form>
  </div>
</main>
{% endblock %}
