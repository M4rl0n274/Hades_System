{% extends 'navBar.html' %}

{% block barraNavegacion %}
<main>
    <div class="container mt-4">
        <h2 class="mb-4">Registro de Cliente</h2>

        <form method="POST">
            <!-- Bloque 1: Información Personal -->
            <div class="form-row">
                <div class="form-group col-md-6">
                    <label for="nombre">Nombre</label>
                    <input type="text" class="form-control" id="nombre" name="nombre"
                        placeholder="Ingrese su Nombre o nombres">
                </div>
                <div class="form-group col-md-6">
                    <label for="apellido">Apellidos</label>
                    <input type="text" class="form-control" id="apellido" name="apellido" placeholder="Apellidos">
                </div>
            </div>

            <!-- Bloque 2: Datos de Contacto y Edad -->
            <div class="form-row">
                <div class="form-group col-md-4">
                    <label for="edad">Edad</label>
                    <input type="number" class="form-control" id="edad" name="edad" placeholder="Edad">
                </div>
                <div class="form-group col-md-4">
                    <label for="correo">Correo</label>
                    <input type="email" class="form-control" id="correo" name="correo" placeholder="correo">
                </div>
                <div class="form-group col-md-4">
                    <label for="documentoIdentidad">Documento de Identidad</label>
                    <input type="text" class="form-control" id="documentoIdentidad" name="documentoIdentidad"
                        placeholder="C.C">
                </div>
            </div>

            <!-- Bloque 3: Ubicación y Fechas -->
            <div class="form-row">
                <div class="form-group col-md-4">
                    <label for="direccion">Dirección</label>
                    <input type="text" class="form-control" id="direccion" name="direccion"
                        placeholder="Calle 3 # 12 - 21">
                </div>
                <div class="form-group col-md-4">
                    <label for="telefono">Teléfono</label>
                    <input type="number" class="form-control" id="telefono" name="telefono" placeholder="658978">
                </div>

            <div class="form-group col-md-4">
                <label for="FechaDeNacimiento">Fecha de Nacimiento</label>
                <input type="date" class="form-control" id="FechaDeNacimiento" name="FechaDeNacimiento">
            </div>


            <!-- Botón de envío completamente visible -->
            <div class="mt-3">
                <button type="submit" class="btn btn-primary px-4">Enviar</button>
            </div>
        </form>
    </div>
</main>
{% endblock %}
