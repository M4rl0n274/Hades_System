{% extends 'navBar.html' %}

{% block barraNavegacion %}
<main class="main-content">
  <div class="form-header-wrapper">
    <h2>Registro de Factura</h2>
  </div>

  <div class="form-card">
    <form method="POST" action="{{ url_for('facturas.nuevo') }}" class="custom-form">
      
      <!-- Seccion 1: Datos de la Venta (3 Columnas) -->
      <div class="form-grid grid-col-3">
        <div class="form-group">
          <label for="id_cliente">Cliente</label>
          <select class="form-control" id="id_cliente" name="id_cliente" required>
            <option value="" disabled selected>Seleccione un cliente...</option>
            {% for c in clientes %}
              <option value="{{ c.id }}">{{ c.nombre }} {{ c.apellido }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label for="id_vendedor">Vendedor</label>
          <select class="form-control" id="id_vendedor" name="id_vendedor" required>
            <option value="" disabled selected>Seleccione un vendedor...</option>
            {% for v in vendedores %}
              <option value="{{ v.id }}">{{ v.nombre }} {{ v.apellido }}</option>
            {% endfor %}
          </select>
        </div>
        
        <div class="form-group">
          <label for="id_usuario">Usuario</label>
          <select class="form-control" id="id_usuario" name="id_usuario" required>
            <option value="" disabled selected>Seleccione un usuario...</option>
            {% for u in usuarios %}
              <option value="{{ u.id }}">{{ u.nombre }} {{ u.apellido }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div class="form-divider"></div>
      
      <!-- Sección 2: Detalle de Productos -->
      <div class="dynamic-section-header">
        <h3>Detalle de Productos</h3>
      </div>

      <div id="productos-container" class="dynamic-items-wrapper">
        <div class="producto-item dynamic-row">
          <div class="form-group flex-2">
            <label>Producto</label>
            <select name="id_producto[]" class="form-control" required>
              <option value="" disabled selected>Seleccione un producto...</option>
              {% for p in productos %}
                <option value="{{ p.id }}">{{ p.nombre_producto }} - ${{ p.valor_unitario }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="form-group flex-1">
            <label>Cantidad</label>
            <input type="number" name="cantidad[]" class="form-control" min="1" placeholder="Cantidad" required>
          </div>
          <div class="form-group flex-action">
            <button type="button" class="btn-remove btn-danger" style="display: none;">Quitar</button>
          </div>
        </div>
      </div>

      <div class="dynamic-actions">
        <button type="button" id="add-producto" class="btn-secondary">+ Agregar otro producto</button>
      </div>

      <div class="form-divider"></div>

      <div class="form-actions">
        <button type="submit" class="btn-primary">Guardar Factura</button>
      </div>
    </form>
  </div>
</main>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const container = document.getElementById('productos-container');
    const addBtn = document.getElementById('add-producto');

    function attachRemoveEvent(button) {
        button.addEventListener('click', function() {
            const row = this.closest('.producto-item');
            if (container.querySelectorAll('.producto-item').length > 1) {
                row.remove();
            }
        });
    }

    addBtn.addEventListener('click', function() {
        const rows = container.querySelectorAll('.producto-item');
        const newRow = rows[0].cloneNode(true);
        
        // Limpiar inputs numéricos y reiniciar selects a la opción por defecto
        newRow.querySelectorAll('input').forEach(input => input.value = '');
        newRow.querySelectorAll('select').forEach(select => select.selectedIndex = 0);
        
        const removeBtn = newRow.querySelector('.btn-remove');
        removeBtn.style.display = 'inline-flex';
        attachRemoveEvent(removeBtn);

        container.appendChild(newRow);
    });
});
</script>
{% endblock %}
