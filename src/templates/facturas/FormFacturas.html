{% extends 'navBar.html' %}

{% block barraNavegacion %}
<main>
    <div class="container mt-4">
        <h2 class="mb-4">Registro de Factura</h2>

        <form method="POST" action="{{ url_for('facturas.nuevo') }}">

            <div class="form-row">
                <div class="form-group col-md-4">
                    <label for="id_cliente">ID Cliente</label>
                    <input type="number" class="form-control" id="id_cliente" name="id_cliente" placeholder="Ej: 1" required>
                </div>

                <div class="form-group col-md-4">
                    <label for="id_vendedor">ID Vendedor</label>
                    <input type="number" class="form-control" id="id_vendedor" name="id_vendedor" placeholder="Ej: 1" required>
                </div>
                
                <div class="form-group col-md-4">
                    <label for="id_usuario">ID Usuario</label>
                    <input type="number" class="form-control" id="id_usuario" name="id_usuario" placeholder="Ej: 1" required>
                </div>
            </div>

            <hr class="my-4">
            <h4 class="mb-3">Detalle de Productos</h4>

            <!-- Contenedor Dinámico de Productos -->
            <div id="productos-container">
                <div class="form-row producto-item align-items-center mb-2">
                    <div class="form-group col-md-6 mb-0">
                        <label>ID Producto</label>
                        <input type="number" name="id_producto[]" class="form-control" placeholder="ID del producto" required>
                    </div>
                    <div class="form-group col-md-4 mb-0">
                        <label>Cantidad</label>
                        <input type="number" name="cantidad[]" class="form-control" min="1" placeholder="Cantidad" required>
                    </div>
                    <div class="form-group col-md-2 mb-0 d-flex align-items-end" style="height: 100%;">
                        <button type="button" class="btn btn-danger btn-block btn-remove mt-4" style="display: none;">Quitar</button>
                    </div>
                </div>
            </div>

            <div class="mt-3">
                <button type="button" id="add-producto" class="btn btn-secondary btn-sm">+ Agregar otro producto</button>
            </div>

            <hr class="my-4">

            <!-- Botón de para envíar -->
            <div class="mt-3">
                <button type="submit" class="btn btn-primary px-4">Guardar Factura</button>
            </div>
        </form>
    </div>
</main>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const container = document.getElementById('productos-container');
    const addBtn = document.getElementById('add-producto');

    // Agregar nuevo renglón de producto
    addBtn.addEventListener('click', function() {
        const rows = container.querySelectorAll('.producto-item');
        const newRow = rows[0].cloneNode(true);
        
        // Limpiar inputs del clon
        newRow.querySelectorAll('input').forEach(input => input.value = '');
        
        // Mostrar botón de quitar
        const removeBtn = newRow.querySelector('.btn-remove');
        removeBtn.style.display = 'block';
        
        removeBtn.addEventListener('click', function() {
            newRow.remove();
        });

        container.appendChild(newRow);
    });
});
</script>
{% endblock %}
