{% extends 'navBar.html' %}

{% block barraNavegacion %}
<main class="main-content">
  <!-- Cabecera Reutilizable -->
  <div class="form-header-wrapper">
    <h2>Registro de Usuario</h2>
  </div>

  <!-- Tarjeta Contenedora del Formulario -->
  <div class="form-card">
    <form method="POST" class="custom-form">
      
      <!-- Bloque 1: Información Personal (2 Columnas) -->
      <div class="form-grid grid-col-2">
        <div class="form-group">
          <label for="nombre">Nombre</label>
          <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Ingrese nombre" required autofocus>
        </div>
        <div class="form-group">
          <label for="apellido">Apellido</label>
          <input type="text" class="form-control" id="apellido" name="apellido" placeholder="Ingrese apellido" required>
        </div>
      </div>

      <!-- Bloque 2: Documento y Correo (2 Columnas) -->
      <div class="form-grid grid-col-2">
        <div class="form-group">
          <label for="documento_identidad">Documento de Identidad</label>
          <input type="text" class="form-control" id="documento_identidad" name="documento_identidad" placeholder="Número de documento" required>
        </div>
        <div class="form-group">
          <label for="correo">Correo Electrónico</label>
          <input type="email" class="form-control" id="correo" name="correo" placeholder="usuario@sena.edu.co" required>
        </div>
      </div>

      <!-- Bloque 3: Contraseña y Rol (2 Columnas) -->
      <div class="form-grid grid-col-2">
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
        </div>
        <div class="form-group">
          <label for="rol">Rol del Usuario</label>
          <select class="form-control" id="rol" name="rol" required>
            <option value="" disabled selected>Seleccione un rol...</option>
            <option value="Administrador">Administrador</option>
            <option value="Vendedor">Vendedor</option>
            <option value="Usuario">Usuario</option>
          </select>
        </div>
      </div>

      <!-- Botones de Acción -->
      <div class="form-actions" style="display: flex; gap: 10px; align-items: center;">
        <button type="submit" class="btn-primary">Guardar Usuario</button>
        <a href="{{ url_for('usuarios.index') }}" class="btn btn-secondary" style="text-decoration: none; padding: 0.5rem 1rem; border-radius: 4px;">Cancelar</a>
      </div>

    </form>
  </div>
</main>
{% endblock %}
