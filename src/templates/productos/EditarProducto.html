{% extends 'navBar.html' %}

{% block barraNavegacion %}
<main class="main-content">
    <!-- Cabecera Reutilizable -->
    <div class="form-header-wrapper">
        <h2>Editar Producto</h2>
    </div>

    <!-- Tarjeta Contenedora del Formulario -->
    <div class="form-card">
        <!-- El action apunta a la ruta de edición con el ID del producto -->
        <form method="POST" action="{{ url_for('productos.editar', id=producto.id) }}" class="custom-form">

            <!-- Bloque 1: Categoría y Nombre (2 Columnas) -->
            <div class="form-grid grid-col-2">


                <div class="form-group">
                    <label for="id_categoria">Categoría</label>
                    <select class="form-control" id="id_categoria" name="id_categoria" required>
                        <option value="" disabled>Seleccione una categoría...</option>
                        {% for categoria in categorias %}
                        <!-- Marcamos como 'selected' la categoría que ya tiene asignada el producto -->
                        <option value="{{ categoria.id }}" {% if categoria.id==producto.id_categoria %}selected{% endif
                            %}>
                            {{ categoria.nombre_categoria }}
                        </option>
                        {% endfor %}
                    </select>
                </div>  



                <div class="form-group">
                    <label for="nombre_producto">Nombre del Producto</label>
                    <input type="text" class="form-control" id="nombre_producto" name="nombre_producto"
                        value="{{ producto.nombre_producto }}" required>
                </div>
            </div>

            <!-- Bloque 2: Detalle, Costo y Stock (3 Columnas) -->
            <div class="form-grid grid-col-3">
                <div class="form-group">
                    <label for="descripcion">Descripción</label>
                    <input type="text" class="form-control" id="descripcion" name="descripcion"
                        value="{{ producto.descripcion }}" required>
                </div>
                <div class="form-group">
                    <label for="valor_unitario">Costo Unitario</label>
                    <input type="number" step="0.01" class="form-control" id="valor_unitario" name="valor_unitario"
                        value="{{ producto.valor_unitario }}" required>
                </div>
                <div class="form-group">
                    <label for="stock">Stock</label>
                    <input type="number" class="form-control" id="stock" name="stock" value="{{ producto.stock }}"
                        required>
                </div>
            </div>

            <!-- Bloque 3: Identificador Único (1 Columna) -->
            <div class="form-grid grid-col-1">
                <div class="form-group">
                    <label for="codigo">Código</label>
                    <input type="text" class="form-control" id="codigo" name="codigo" value="{{ producto.codigo }}"
                        required>
                </div>
            </div>

            <!-- Botones de Acción -->
            <div class="form-actions" style="display: flex; gap: 10px; align-items: center;">
                <button type="submit" class="btn-primary">Actualizar Producto</button>
                <a href="{{ url_for('productos.index') }}" class="btn btn-secondary"
                    style="text-decoration: none; padding: 0.5rem 1rem; border-radius: 4px;">Cancelar</a>
            </div>

        </form>
    </div>
</main>
{% endblock %}
